<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Help your city hear its people · Citizen Portal Story</title>
<meta name="description" content="A first-draft Citizen Portal Story: crowdfund Polco so people can fund its use by their city. Nick Mastronardi has not reviewed this page. Mechanics are still open."/>
<link rel="stylesheet" href="story.css"/>
</head>
<body class="min-h-full bg-paper font-sans text-body antialiased">
<div id="app" style="color:#d0d5e0;font-family:system-ui,sans-serif;padding:48px 24px;background:#0a0e1a;min-height:100vh">Loading the story…</div>
<script>
Promise.all(["b0.html","b1.html","b2.html","b3.html"].map(function(u){
  return fetch(u).then(function(r){ if(!r.ok) throw new Error(u+" "+r.status); return r.text(); });
})).then(function(parts){
  var wrap=document.createElement("div");
  wrap.innerHTML=parts.join("");
  var incoming=wrap.querySelector("body")||wrap;
  document.body.innerHTML=incoming.innerHTML;
  document.body.className=incoming.className||document.body.className;
  document.body.querySelectorAll("script").forEach(function(old){
    var s=document.createElement("script");
    s.textContent=old.textContent;
    old.replaceWith(s);
  });
}).catch(function(err){
  document.getElementById("app").textContent="Could not load the story: "+err;
});
</script>
</body>
</html>
